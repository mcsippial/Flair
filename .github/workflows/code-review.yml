name: Semi-Daily Code Review

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC
    - cron: '0 18 * * *'  # 6 PM UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-darwin-QahQy

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + capture output
        id: build
        run: |
          npm run build 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Analyze bundle
        id: bundle
        run: |
          python3 - <<'EOF'
          import os, json, re

          dist = 'dist/assets'
          files = os.listdir(dist) if os.path.isdir(dist) else []

          total = 0
          chunks = []
          for f in files:
            path = os.path.join(dist, f)
            size = os.path.getsize(path)
            total += size
            if f.endswith('.js') or f.endswith('.css'):
              chunks.append((f, size))

          chunks.sort(key=lambda x: -x[1])

          lines = [f"**Total dist size:** {total/1024:.1f} KB"]
          for name, sz in chunks[:8]:
            flag = ' ⚠️' if sz > 500_000 else ''
            lines.append(f"- `{name}`: {sz/1024:.1f} KB{flag}")

          print('\n'.join(lines))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            summary = '\n'.join(lines).replace('%', '%25').replace('\n', '%0A')
            f.write(f"summary={summary}\n")
            f.write(f"total_kb={total/1024:.0f}\n")
          EOF

      - name: Check for build warnings
        id: warnings
        run: |
          WARNS=$(grep -iE 'warning|deprecated|unused' build.log | grep -v 'Node.js' | head -20 || true)
          echo "found=$( [ -n "$WARNS" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          {
            echo 'content<<EOF'
            echo "$WARNS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Check for TODO/FIXME/HACK
        id: debt
        run: |
          ITEMS=$(grep -rn --include="*.jsx" --include="*.js" -E "TODO|FIXME|HACK|XXX" src/ | grep -v node_modules | head -20 || true)
          {
            echo 'content<<EOF'
            echo "$ITEMS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Post issue with findings
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const buildLog = require('fs').readFileSync('build.log', 'utf8').slice(-3000);
            const buildOk = !buildLog.includes('error') && !buildLog.includes('Error');

            const bundle = `${{ steps.bundle.outputs.summary }}`;
            const totalKb = parseInt(`${{ steps.bundle.outputs.total_kb }}`);
            const warnings = `${{ steps.warnings.outputs.content }}`.trim();
            const debt = `${{ steps.debt.outputs.content }}`.trim();

            const statusEmoji = buildOk ? '✅' : '❌';
            const bundleFlag = totalKb > 1500 ? ' ⚠️ over 1.5 MB' : '';

            let body = `## Flair Code Review — ${date}\n\n`;
            body += `### Build ${statusEmoji}\n`;

            if (!buildOk) {
              body += `\`\`\`\n${buildLog.slice(-1500)}\n\`\`\`\n\n`;
            } else {
              body += `Build succeeded.\n\n`;
            }

            body += `### Bundle Analysis${bundleFlag}\n${bundle}\n\n`;

            if (warnings) {
              body += `### Build Warnings ⚠️\n\`\`\`\n${warnings}\n\`\`\`\n\n`;
            } else {
              body += `### Build Warnings\nNone.\n\n`;
            }

            if (debt) {
              body += `### Tech Debt (TODO/FIXME/HACK)\n\`\`\`\n${debt}\n\`\`\`\n\n`;
            } else {
              body += `### Tech Debt\nNone found.\n\n`;
            }

            body += `---\n_Auto-generated by the semi-daily code review workflow._`;

            // Close any previous open review issues before opening a new one
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'auto-review',
              state: 'open',
            });
            for (const issue of existing.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto Review] ${date} — Build ${buildOk ? 'OK' : 'FAILED'} · ${totalKb} KB`,
              body,
              labels: ['auto-review'],
            });
